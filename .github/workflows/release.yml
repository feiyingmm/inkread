name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '墨阅 ${{ github.ref_name }}'
          releaseBody: '自动构建。Windows 安装包(NSIS setup.exe)与 Android APK(arm64)见下方 Assets。'
          releaseDraft: false
          prerelease: false

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Export NDK env
        # ANDROID_NDK_LATEST_HOME 是 runner 机器环境变量,workflow 表达式读不到,须经 GITHUB_ENV 注入。
        # NDK r23+ 为纯 LLVM 工具链,vendored OpenSSL 交叉编译需要显式 CC/AR/RANLIB 并把工具链加入 PATH。
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB_aarch64_linux_android=$TOOLCHAIN/llvm-ranlib" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - name: Init android project
        run: npx tauri android init
      - name: Apply brand icons
        run: cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/
      - name: Build APK (arm64, unsigned)
        run: npx tauri android build --apk --target aarch64
      - name: Sign APK
        run: |
          KS=/tmp/inkread.keystore
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$KS"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          echo "unsigned: $APK"
          "$BT/zipalign" -f 4 "$APK" /tmp/aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASS }}" \
            --out "Inkread_${GITHUB_REF_NAME#v}_arm64.apk" /tmp/aligned.apk
      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # windows job 的 tauri-action 负责创建 Release;android 可能先到终点,须兜底创建避免竞态
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "墨阅 $GITHUB_REF_NAME" --notes "自动构建。Windows 安装包与 Android APK(arm64)见 Assets。"
          gh release upload "$GITHUB_REF_NAME" Inkread_*_arm64.apk --clobber
