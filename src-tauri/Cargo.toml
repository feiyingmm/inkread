[package]
name = "inkread"
version = "0.5.0"
description = "墨阅 —— 跨平台 Markdown 阅读应用"
authors = ["mahonggeng"]
edition = "2021"

[lib]
name = "inkread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.20"
percent-encoding = "2"
base64 = "0.22"
# 字体扩展下载。走 rustls + webpki 内置根证书,刻意不复用 Android 那套 vendored OpenSSL:
# 那份是 no-stdio 编译的,任何"给证书文件路径"的接口都是死路(见 install_ca_bundle 的注释),
# 纯 Rust 的 TLS 栈能一次性绕开整类问题。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
sha2 = "0.10"

# 桌面:单实例(双击 md 文件复用已开窗口)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# Android 交叉编译:静态 openssl(M5 启用 android target 时生效);jni 供授权页拉起/WebView 设置
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
# libgit2-sys 只为拿 GIT_OPT_ADD_SSL_X509_CERT 常量与 git_libgit2_opts 符号:
# 把 CA 根证书**在内存里**灌进 libgit2 的信任库。git2 只暴露了「给一个证书文件路径」的
# 接口,而那条路在 Android 上物理不可行(详见 install_ca_bundle)。
# 它本就在依赖树内(经 git2 传递),显式引入不会引入新版本。
# 注:OpenSSL 那几个符号改为手写 extern 声明(见 openssl_ffi 模块)——把 openssl-sys 提成
# 直接依赖会改变构建指纹,导致 vendored OpenSSL 整个重编,得不偿失。
libgit2-sys = "0.18"
jni = "0.21"

[profile.release]
strip = true
lto = true
codegen-units = 1
